name: Build & Release Winlator APK (Android 15+)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Winlator Android 15+ APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apks/ \;
          ls -lh release-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winlator-android15-apks
          path: release-apks/*.apk
          retention-days: 30

      - name: Generate Release Tag
        id: tag_gen
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v11.2.0-android15-b${{ github.run_number }}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_gen.outputs.tag }}
          name: "Winlator ${{ steps.tag_gen.outputs.tag }} (Android 15+ Compatible)"
          body: |
            ## Winlator Native Build for Android 15+ (${{ steps.tag_gen.outputs.tag }})

            Automated build compiled for Android 14 and Android 15+ devices.

            ### Fixes & Enhancements:
            - **Target SDK 35 (Android 15)**: Resolves `INSTALL_FAILED_DEPRECATED_SDK_VERSION` preventing installation on modern Android 15 / HyperOS devices.
            - **16 KB Page Size Alignment**: Native libraries compiled with `-Wl,-z,max-page-size=16384` for compatibility with Android 15 kernels.
            - **All Files Access (MANAGE_EXTERNAL_STORAGE)**: Properly requests full storage access on Android 11+ to run games from device storage without scoped storage restrictions.
            - **arm64-v8a Architecture**: Optimized 64-bit binaries.
          files: |
            release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
